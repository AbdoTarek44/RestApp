services:
  - type: web
    name: maalish-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MAALISH_MODEL
        value: gemini-3.1-flash-lite
