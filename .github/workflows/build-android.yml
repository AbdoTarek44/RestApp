name: Build Maalish Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: maalish-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Gemini backend sources
        run: |
          node --check backend/server.js
          node --check cloudflare-worker/src/index.js

      - name: Rebuild Maalish base and apply V10 patches
        run: |
          python scripts/reconstruct.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app/pubspec.yaml')
          s = p.read_text().replace('version: 0.2.0+2','version: 0.10.0+10')
          if 'firebase_core:' not in s:
              s = s.replace('  speech_to_text: ^7.0.0', '  speech_to_text: ^7.0.0\n  firebase_core: ^5.1.0\n  firebase_auth: ^7.0.1\n  google_sign_in: ^7.2.0\n  cloud_firestore: ^7.1.0')
          p.write_text(s)
          PY

      - name: Generate Android platform files
        working-directory: app
        run: |
          flutter create . --platforms=android --project-name maalish_app --org com.maalish.app
          rm -rf test
          python ../scripts/configure_preview.py

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter sources
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test conversation persistence and resumption
        working-directory: app
        run: |
          mkdir -p test
          cp ../tests/*.dart test/
          flutter test

      - name: Restore preview development signing key
        uses: actions/cache@v4
        with:
          path: ~/.maalish-preview-signing/debug.keystore
          key: maalish-preview-development-signing-v1

      - name: Build release APK
        working-directory: app
        run: |
          mkdir -p "$HOME/.maalish-preview-signing"
          export MAALISH_SIGNING_STORE="$HOME/.maalish-preview-signing/debug.keystore"
          if [ ! -f "$MAALISH_SIGNING_STORE" ]; then
            keytool -genkeypair -keystore "$MAALISH_SIGNING_STORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Maalish Preview Development,O=Maalish,C=EG" -keyalg RSA -validity 10000
          fi
          flutter build apk --release --dart-define-from-file=../config/firebase.preview.android.json

      - name: Report actual APK signing certificate
        run: |
          apk_signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apk_signer" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | tee Maalish-v10-signing.txt

      - name: Collect APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Maalish-v10-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maalish-v10-Preview-APK
          path: |
            Maalish-v10-preview.apk
            Maalish-v10-signing.txt
          if-no-files-found: error
