name: Build Maalish Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Gemini backend source
        run: node --check backend/server.js

      - name: Rebuild Maalish base and apply V5 patches
        run: |
          cat build_src_v2_small/part_*.b64 | base64 -d > maalish_source_v2.zip
          rm -rf unpacked app
          mkdir -p unpacked
          unzip -o maalish_source_v2.zip -d unpacked || true
          cp -R unpacked/maalish_app app
          cp -R v3_patch/lib/* app/lib/
          cp -R v4_patch/lib/* app/lib/
          cp -R v5_patch/lib/* app/lib/
          python - <<'PY'
          from pathlib import Path
          p = Path('app/pubspec.yaml')
          s = p.read_text().replace('version: 0.2.0+2','version: 0.5.0+5')
          if 'firebase_core:' not in s:
              s = s.replace('  speech_to_text: ^7.0.0', '  speech_to_text: ^7.0.0\n  firebase_core: ^5.0.0\n  firebase_auth: ^7.0.0\n  google_sign_in: ^7.2.0')
          p.write_text(s)
          PY

      - name: Generate Android platform files
        working-directory: app
        run: |
          flutter create . --platforms=android --project-name maalish_app --org com.maalish.app
          rm -rf test
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = marker + '\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(marker, perms)
          manifest.write_text(s)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          gradle.write_text(g)
          PY

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: >-
          flutter build apk --release
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          --dart-define=MAALISH_API_URL=${{ secrets.MAALISH_API_URL }}

      - name: Collect APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Maalish-v5-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maalish-v5-APK
          path: Maalish-v5-release.apk
          if-no-files-found: error
