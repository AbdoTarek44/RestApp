name: Build Maalish Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rebuild Maalish v2 source archive
        run: |
          cat build_src_v2_small/part_*.b64 | base64 -d > maalish_source_v2.zip
          rm -rf unpacked app
          mkdir -p unpacked
          unzip -o maalish_source_v2.zip -d unpacked || true
          cp -R unpacked/maalish_app app
          cp patches_v2/chat_screen.dart app/lib/features/chat/chat_screen.dart

      - name: Generate Android platform files
        working-directory: app
        run: |
          flutter create . --platforms=android --project-name maalish_app --org com.maalish.app
          rm -rf test
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = marker + '\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(marker, perms)
          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Collect APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Maalish-v2-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maalish-v2-APK
          path: Maalish-v2-release.apk
          if-no-files-found: error
