name: Build Maalish Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: maalish-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Gemini backend sources
        run: |
          node --check backend/server.js
          node --check cloudflare-worker/src/index.js

      - name: Rebuild Maalish base and apply V8 patches
        run: |
          python scripts/reconstruct.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app/pubspec.yaml')
          s = p.read_text().replace('version: 0.2.0+2','version: 0.8.0+8')
          if 'firebase_core:' not in s:
              s = s.replace('  speech_to_text: ^7.0.0', '  speech_to_text: ^7.0.0\n  firebase_core: ^5.1.0\n  firebase_auth: ^7.0.1\n  google_sign_in: ^7.2.0\n  cloud_firestore: ^7.1.0')
          p.write_text(s)
          PY

      - name: Generate Android platform files
        working-directory: app
        run: |
          flutter create . --platforms=android --project-name maalish_app --org com.maalish.app
          rm -rf test
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = marker + '\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(marker, perms)
          manifest.write_text(s)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          gradle.write_text(g)
          PY

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter sources
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: app
        run: >-
          flutter build apk --release
          --dart-define-from-file=../config/firebase.android.json

      - name: Report actual APK signing certificate
        run: |
          apk_signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apk_signer" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | tee Maalish-v8-signing.txt

      - name: Collect APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Maalish-v8-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maalish-v8-APK
          path: |
            Maalish-v8-release.apk
            Maalish-v8-signing.txt
          if-no-files-found: error
